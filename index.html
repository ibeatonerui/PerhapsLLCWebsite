<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Perhaps</title>
  <meta name="description" content="Perhaps.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:title" content="Perhaps">
  <meta property="og:description" content="Perhaps.">
  <meta property="og:url" content="https://perhaps.studio/">
  <meta property="og:image" content="https://perhaps.studio/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    h1 {
      width: min(70vw, 480px);
      aspect-ratio: 1484 / 428;
      /* The wordmark's shape, filled with a faint left-to-right shift in white */
      background: linear-gradient(90deg, #d8d8d8, #ffffff);
      -webkit-mask: url("assets/wordmark.png") center / contain no-repeat;
      mask: url("assets/wordmark.png") center / contain no-repeat;
      font-size: 0;
      color: transparent;
    }
  </style>
</head>
<body>
  <h1>Perhaps</h1>
</body>
</html>
